<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snake</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --grid:#1f232c; --snake:#4ade80; --snake2:#22c55e;
    --food:#f87171; --text:#e5e7eb; --muted:#9ca3af; --accent:#60a5fa;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f4f5f7; --panel:#ffffff; --grid:#e5e7eb; --snake:#16a34a; --snake2:#15803d;
      --food:#dc2626; --text:#111827; --muted:#6b7280; --accent:#2563eb;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1115; --panel:#171a21; --grid:#1f232c; --snake:#4ade80; --snake2:#22c55e;
    --food:#f87171; --text:#e5e7eb; --muted:#9ca3af; --accent:#60a5fa;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%; margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .wrap{
    min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:20px;
  }
  h1{margin:0; font-size:1.4rem; letter-spacing:0.5px;}
  .panel{
    background:var(--panel); border-radius:16px; padding:16px; box-shadow:0 4px 20px rgba(0,0,0,0.25);
    display:flex; flex-direction:column; align-items:center; gap:12px; max-width:100%;
  }
  #score{font-size:1rem; color:var(--muted); display:flex; gap:18px;}
  #score b{color:var(--text);}
  canvas{
    background:var(--grid); border-radius:10px; display:block; max-width:100%; height:auto;
    touch-action:none;
  }
  .msg{color:var(--muted); font-size:0.9rem; text-align:center; min-height:1.3em;}
  .controls{display:grid; grid-template-columns:repeat(3,52px); grid-template-rows:repeat(2,52px); gap:8px; margin-top:4px;}
  .controls button{
    font-size:1.3rem; border:none; border-radius:10px; background:var(--grid); color:var(--text);
    cursor:pointer; user-select:none;
  }
  .controls button:active{background:var(--accent); color:#fff;}
  #up{grid-column:2; grid-row:1;}
  #left{grid-column:1; grid-row:2;}
  #down{grid-column:2; grid-row:2;}
  #right{grid-column:3; grid-row:2;}
  #restart{
    padding:8px 18px; border:none; border-radius:8px; background:var(--accent); color:#fff;
    font-size:0.95rem; cursor:pointer;
  }
  .hint{font-size:0.8rem; color:var(--muted);}
</style>
</head>
<body>
<div class="wrap">
  <h1>🐍 Snake</h1>
  <div class="panel">
    <div id="score">Puntos: <b id="pts">0</b> &nbsp;|&nbsp; Récord: <b id="best">0</b></div>
    <canvas id="game" width="360" height="360"></canvas>
    <div class="msg" id="msg">Pulsa una flecha o toca un botón para empezar</div>
    <button id="restart">Reiniciar</button>
    <div class="controls">
      <button id="up">↑</button>
      <button id="left">←</button>
      <button id="down">↓</button>
      <button id="right">→</button>
    </div>
    <div class="hint">Flechas / WASD también funcionan</div>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const cell = 18;
  const cols = canvas.width / cell;
  const rows = canvas.height / cell;
  const ptsEl = document.getElementById('pts');
  const bestEl = document.getElementById('best');
  const msgEl = document.getElementById('msg');

  let best = 0;
  try { best = parseInt(localStorage.getItem('snake_best') || '0', 10) || 0; } catch(e) {}
  bestEl.textContent = best;

  let snake, dir, nextDir, food, score, running, loopId, speed;

  function reset(){
    snake = [{x:8,y:9},{x:7,y:9},{x:6,y:9}];
    dir = {x:1,y:0};
    nextDir = {x:1,y:0};
    score = 0;
    speed = 130;
    running = false;
    ptsEl.textContent = score;
    placeFood();
    msgEl.textContent = 'Pulsa una flecha o toca un botón para empezar';
    draw();
  }

  function placeFood(){
    let ok = false;
    while(!ok){
      food = { x: Math.floor(Math.random()*cols), y: Math.floor(Math.random()*rows) };
      ok = !snake.some(s => s.x===food.x && s.y===food.y);
    }
  }

  function start(){
    if (running) return;
    running = true;
    msgEl.textContent = '';
    tick();
  }

  function tick(){
    if (!running) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows || snake.some(s => s.x===head.x && s.y===head.y)) {
      gameOver();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      ptsEl.textContent = score;
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        try { localStorage.setItem('snake_best', String(best)); } catch(e) {}
      }
      placeFood();
      speed = Math.max(60, speed - 3);
    } else {
      snake.pop();
    }

    draw();
    loopId = setTimeout(tick, speed);
  }

  function gameOver(){
    running = false;
    clearTimeout(loopId);
    msgEl.textContent = '¡Choque! Puntuación final: ' + score + '. Pulsa Reiniciar.';
  }

  function draw(){
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--grid');
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--food');
    ctx.beginPath();
    ctx.arc(food.x*cell+cell/2, food.y*cell+cell/2, cell*0.38, 0, Math.PI*2);
    ctx.fill();

    snake.forEach((s,i) => {
      ctx.fillStyle = i===0
        ? getComputedStyle(document.documentElement).getPropertyValue('--snake2')
        : getComputedStyle(document.documentElement).getPropertyValue('--snake');
      ctx.fillRect(s.x*cell+1, s.y*cell+1, cell-2, cell-2);
    });
  }

  function setDir(x,y){
    if (dir.x === -x && dir.y === -y) return;
    if (dir.x === x && dir.y === y) { start(); return; }
    nextDir = {x,y};
    start();
  }

  window.addEventListener('keydown', (e) => {
    switch(e.key){
      case 'ArrowUp': case 'w': case 'W': setDir(0,-1); e.preventDefault(); break;
      case 'ArrowDown': case 's': case 'S': setDir(0,1); e.preventDefault(); break;
      case 'ArrowLeft': case 'a': case 'A': setDir(-1,0); e.preventDefault(); break;
      case 'ArrowRight': case 'd': case 'D': setDir(1,0); e.preventDefault(); break;
    }
  });

  document.getElementById('up').addEventListener('click', () => setDir(0,-1));
  document.getElementById('down').addEventListener('click', () => setDir(0,1));
  document.getElementById('left').addEventListener('click', () => setDir(-1,0));
  document.getElementById('right').addEventListener('click', () => setDir(1,0));
  document.getElementById('restart').addEventListener('click', () => { clearTimeout(loopId); reset(); });

  // swipe support
  let touchStart = null;
  canvas.addEventListener('touchstart', (e) => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, {passive:true});
  canvas.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    if (Math.abs(dx) > Math.abs(dy)) {
      setDir(dx > 0 ? 1 : -1, 0);
    } else {
      setDir(0, dy > 0 ? 1 : -1);
    }
    touchStart = null;
  }, {passive:true});

  reset();
})();
</script>
</body>
</html>
